<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SuLi Coffee</title>

    <!-- Font / CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
      rel="stylesheet"
    />

    <!-- Inline style có nonce -->
    <style nonce="__NONCE__">
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- CSP nonce exposure for testing -->
    <script nonce="__NONCE__">
      // ✅ Expose nonce to global scope
      window.__CSP_NONCE__ = "__NONCE__";
      console.log("✅ CSP initialized with nonce:", window.__CSP_NONCE__);
    </script>
  </body>
</html>
